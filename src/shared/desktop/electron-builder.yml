# One product package per OS: the shell with both apps (ADR-0031, ADR-0032).
# Build first (`pnpm build`, plus `pnpm build:sidecar --arch …` for every
# target arch), then `pnpm package` from the repository root.
appId: app.panelyth.desktop
productName: Panelyth
copyright: Copyright © Panelyth contributors
directories:
  output: release
  buildResources: build
extraMetadata:
  # The workspace name (@panelyth/desktop) would name the app's data folders.
  name: panelyth
  productName: Panelyth
  main: dist/main/main.cjs
files:
  - dist/**
  - "!dist/**/*.map"
  - package.json
# The renderers are served from disk through app://panelyth/ and
# app://commander/ and app://documents/, the sidecar runs as a child process: all outside the asar
# (paths.ts).
extraResources:
  - from: build/icon.png
    to: icon.png
  - from: ../../viewer/renderer/dist
    to: renderer
  - from: ../../commander/renderer/dist
    to: commander
  - from: ../docviewer/dist
    to: documents
  - from: resources/bin/${platform}-${arch}
    to: bin
asar: true
# "normal" instead of the default "maximum" (7-Zip -mx=9): the bundled 7za.exe
# crashed with an access violation (0xC0000005) packing the NSIS payload on a
# Windows machine; the installer is only slightly larger.
compression: normal
# No native Node modules: the sidecar is a separate Go binary.
npmRebuild: false
nodeGypRebuild: false
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

mac:
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.photography
  # Ad-hoc signature until Stage P06 adds a Developer ID and notarization:
  # Apple silicon refuses to run unsigned code.
  identity: "-"
  hardenedRuntime: false
  notarize: false

linux:
  icon: build/icons
  target:
    - target: AppImage
      arch: [x64]
    - target: tar.gz
      arch: [x64]
  category: Graphics
  executableName: panelyth

# Updates are a Stage P06 decision: no app-update.yml.
publish: null
