<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="100 100 824 824">
  <title>Panelyth panels</title>
  <!-- The app icon's drawing (icon.svg), cropped to its dark tile. -->
  <defs>
    <linearGradient id="lime" x1="128" y1="128" x2="896" y2="896" gradientUnits="userSpaceOnUse">
      <stop stop-color="#cfec80" />
      <stop offset="1" stop-color="#9bcb3f" />
    </linearGradient>
    <linearGradient id="tile" x1="512" y1="100" x2="512" y2="924" gradientUnits="userSpaceOnUse">
      <stop stop-color="#343b31" />
      <stop offset="1" stop-color="#14170f" />
    </linearGradient>
    <linearGradient id="edge" x1="512" y1="100" x2="512" y2="924" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#tile)" />
  <rect x="102" y="102" width="820" height="820" rx="182" fill="none" stroke="url(#edge)" stroke-width="4" />
  <g transform="translate(128 128) scale(0.75)">
    <rect x="128" y="128" width="192" height="768" rx="80" fill="url(#lime)" />
    <rect x="384" y="128" width="512" height="448" rx="80" fill="url(#lime)" />
    <rect x="384" y="640" width="512" height="256" rx="80" fill="#6a9a38" />
  </g>
</svg>
