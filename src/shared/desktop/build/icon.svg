<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="lime" x1="128" y1="128" x2="896" y2="896" gradientUnits="userSpaceOnUse">
      <stop stop-color="#cfec80" />
      <stop offset="1" stop-color="#9bcb3f" />
    </linearGradient>
  </defs>

  <!-- Three panels on a 16-unit grid (1 unit = 64): the gaps land on whole pixels at 16, 32, 48 and 64 px. -->
  <rect x="128" y="128" width="192" height="768" rx="80" fill="url(#lime)" />
  <rect x="384" y="128" width="512" height="448" rx="80" fill="url(#lime)" />
  <rect x="384" y="640" width="512" height="256" rx="80" fill="#557f2f" />
</svg>
