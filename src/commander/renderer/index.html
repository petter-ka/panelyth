    <!-- The stored theme before the first paint (src/shared/ui/boot/boot.js). -->
    <script src="/boot.js"></script>

      <!--
        Shown from the first paint until React renders (styles.css, .boot-skeleton):
        the commander's outline, with the classes AppShell and its panels use, so a
        first switch to the commander never shows an empty surface.
      -->
