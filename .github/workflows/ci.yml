# Stage P04: lint once, unit and Go tests, the e2e suites of both apps and
# the packaged smoke test on Windows, macOS and Linux.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: shared/sidecar/go.mod
          cache-dependency-path: shared/sidecar/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # ADR-0013: race runs need cgo, which only the Linux runner has set up.
      - name: Go race tests
        working-directory: shared/sidecar
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 -timeout=900s ./...

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: shared/sidecar/go.mod
          cache-dependency-path: shared/sidecar/go.sum
      - run: pnpm install --frozen-lockfile
      # Ubuntu 24.04 restricts unprivileged user namespaces, which Chromium's
      # sandbox needs; the unpackaged Electron has no setuid helper either.
      - name: Allow the Chromium sandbox (Linux)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Unit and Go tests
        run: pnpm test
      - name: Build
        run: pnpm build
      # The viewer's specs still click the "Open folder…" button that the
      # startup folder (Stage 08.5) and C06 removed from the first screen; they
      # join this step once repaired (open item, docs/shared/stages/P04).
      - name: E2E (commander and app switch)
        shell: bash
        run: |
          specs="specs/commander specs/switch.spec.ts"
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a -s "-screen 0 1920x1080x24" pnpm --filter @fastview/e2e exec playwright test $specs
          else
            pnpm --filter @fastview/e2e exec playwright test $specs
          fi
      - name: Package (unpacked)
        run: pnpm package --dir
      - name: Packaged smoke test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a -s "-screen 0 1920x1080x24" pnpm test:smoke
          else
            pnpm test:smoke
          fi
      - name: Upload e2e results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.os }}
          path: shared/e2e/test-results/
          if-no-files-found: ignore
