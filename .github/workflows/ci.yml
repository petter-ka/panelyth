# Stage P04: lint once, unit and Go tests and the packaged smoke test on
# Windows, macOS and Linux. The e2e suites are disabled (see the test job).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/shared/sidecar/go.mod
          cache-dependency-path: src/shared/sidecar/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # ADR-0013: race runs need cgo, which only the Linux runner has set up.
      - name: Go race tests
        working-directory: src/shared/sidecar
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 -timeout=900s ./...

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/shared/sidecar/go.mod
          cache-dependency-path: src/shared/sidecar/go.sum
      - run: pnpm install --frozen-lockfile
      # Ubuntu 24.04 restricts unprivileged user namespaces, which Chromium's
      # sandbox needs; the unpackaged Electron has no setuid helper either.
      - name: Allow the Chromium sandbox (Linux)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The tests create 100k-file fixtures and a fresh sidecar binary; on-access
      # scanning of new files stalled listings and the first start (Stage P04).
      - name: Exclude the workspace and temp from Defender (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, $env:TEMP, $env:RUNNER_TEMP -ErrorAction Stop
          } catch {
            Write-Host "Defender exclusions unavailable: $_"
          }
      - name: Unit and Go tests
        run: pnpm test
      - name: Build
        id: build
        run: pnpm build
      # Disabled: the e2e suites use too many runner minutes. Uncomment to restore.
      # # The viewer's specs were repaired on 2026-10-12 (Stage P04) and run here
      # # too. Four commander tests that predate the document window (ADR-0033)
      # # still fail; see "Open" in docs/shared/stages/P04-cross-platform.md.
      # - name: E2E (viewer, commander and app switch)
      #   # Windows: reported, not blocking, until its timing races are fixed
      #   # (open item in docs/shared/stages/P04-cross-platform.md). Linux and
      #   # macOS block.
      #   continue-on-error: ${{ runner.os == 'Windows' }}
      #   shell: bash
      #   run: |
      #     specs="specs"
      #     if [ "$RUNNER_OS" = "Linux" ]; then
      #       xvfb-run -a -s "-screen 0 1920x1080x24" pnpm --filter @panelyth/e2e exec playwright test $specs
      #     else
      #       pnpm --filter @panelyth/e2e exec playwright test $specs
      #     fi
      # Packaging runs even when an e2e spec failed: the release builds
      # depend on it, and it needs only the build.
      - name: Package (unpacked)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm package --dir
      - name: Packaged smoke test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a -s "-screen 0 1920x1080x24" pnpm test:smoke
          else
            pnpm test:smoke
          fi
      - name: Upload e2e results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.os }}
          path: src/shared/e2e/test-results/
          if-no-files-found: ignore
